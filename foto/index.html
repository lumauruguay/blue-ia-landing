<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luma Audiovisuales – Fotos</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #000000; --text: #ffffff; --muted: #aaaaaa;
      --border: #333333; --red: #cc0000; --red-hover: #ff0000;
    }

    body {
      background: var(--bg); color: var(--text);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 15px; line-height: 1.6; min-height: 100vh;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 28px 40px 20px;
      display: flex; align-items: baseline; gap: 12px;
    }
    header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    header span { color: var(--red); font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; }

    nav {
      padding: 0 40px; border-bottom: 1px solid var(--border);
      display: flex; overflow-x: auto;
    }
    nav button {
      background: none; border: none; border-bottom: 2px solid transparent;
      padding: 14px 20px; font-size: 0.8rem; letter-spacing: 0.1em;
      text-transform: uppercase; cursor: pointer; color: var(--muted);
      white-space: nowrap; transition: color 0.15s, border-color 0.15s;
    }
    nav button:hover { color: var(--text); }
    nav button.active { color: var(--text); border-bottom-color: var(--red); font-weight: 600; }

    main { padding: 36px 40px; max-width: 1100px; }
    .event-panel { display: none; }
    .event-panel.active { display: block; }

    .event-meta { margin-bottom: 28px; max-width: 600px; }
    .event-meta h2 { font-size: 1rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px; }
    .event-meta .date { font-size: 0.78rem; color: var(--red); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }
    .event-meta p { font-size: 0.9rem; color: var(--muted); line-height: 1.65; }

    .photo-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 40px; }

    .photo-item {
      position: relative; width: 250px; height: 167px;
      cursor: pointer; overflow: hidden; border: 2px solid transparent;
      transition: border-color 0.15s; flex-shrink: 0;
      user-select: none; -webkit-user-select: none;
    }
    .photo-item img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      pointer-events: none; -webkit-user-drag: none;
    }
    .photo-item::before {
      content: attr(data-code); position: absolute; top: 6px; right: 6px;
      background: rgba(0,0,0,0.55); color: #fff;
      font-size: 0.65rem; letter-spacing: 0.08em; padding: 2px 5px;
      pointer-events: none; z-index: 2;
    }
    .photo-item.selected { border-color: var(--red); }
    .photo-item.selected::after {
      content: attr(data-code); position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(204,0,0,0.88); color: #fff;
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em;
      text-align: center; padding: 4px 0;
    }

    #cart-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--bg); border-top: 1px solid var(--border);
      padding: 14px 40px; display: flex; align-items: center;
      justify-content: space-between; gap: 16px; z-index: 100;
      transform: translateY(100%); transition: transform 0.25s ease;
    }
    #cart-bar.visible { transform: translateY(0); }
    #cart-summary { font-size: 0.82rem; color: var(--muted); }
    #cart-summary strong { color: var(--text); }
    #cart-codes { font-size: 0.78rem; color: var(--red); letter-spacing: 0.06em; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    #btn-whatsapp {
      background: var(--red); color: #fff; border: none;
      padding: 10px 22px; font-size: 0.78rem; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;
      transition: background 0.15s; white-space: nowrap;
    }
    #btn-whatsapp:hover { background: var(--red-hover); }
    #btn-clear {
      background: none; border: 1px solid var(--border); color: var(--muted);
      padding: 10px 14px; font-size: 0.72rem; letter-spacing: 0.08em;
      text-transform: uppercase; cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    #btn-clear:hover { border-color: var(--red); color: var(--red); }

    footer { padding: 60px 40px 100px; font-size: 0.72rem; color: var(--border); letter-spacing: 0.06em; }
    footer a { color: var(--red); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    @media (max-width: 600px) {
      header, nav, main { padding-left: 16px; padding-right: 16px; }
      .photo-item { width: 160px; height: 107px; }
      #cart-bar { padding: 12px 16px; }
    }
  </style>
</head>
<body>

  <script>document.addEventListener('contextmenu', e => e.preventDefault());</script>

  <header>
    <h1>Luma Audiovisuales</h1>
    <span>Fotos</span>
  </header>

  <nav id="tab-nav"></nav>
  <main id="main-content"></main>

  <div id="cart-bar">
    <div id="cart-summary"><strong id="cart-count">0</strong> foto(s) seleccionada(s)</div>
    <div id="cart-codes"></div>
    <button id="btn-clear" onclick="clearCart()">Limpiar</button>
    <button id="btn-whatsapp" onclick="openWhatsApp()">Contactar por WhatsApp</button>
  </div>

  <footer><a href="https://blue-ia.org">← blue-ia.org</a></footer>

  <script>
    const WHATSAPP_NUMBER = '59891979237';

    // ── DATOS ─────────────────────────────────────────────────────────────
    // Para agregar un evento: copiar un objeto y cambiar sus valores.
    // Fotos van en: fotos/A/A001.jpg, fotos/A/A002.jpg, etc.
    // Los códigos (A001, A002…) se generan automáticamente.

    const events = [
      {
        letter: 'A',
        title: 'Recital de Cámara',
        date: '12 de agosto de 2026',
        description: 'Recital concierto de cámara en Sala Zitarrosa.',
        photos: [
          // Reemplazar con rutas reales: { src: 'fotos/A/A001.jpg' }
          { src: 'https://placehold.co/500x333/111/fff?text=A001' },
          { src: 'https://placehold.co/500x333/222/fff?text=A002' },
          { src: 'https://placehold.co/500x333/333/fff?text=A003' },
          { src: 'https://placehold.co/500x333/444/fff?text=A004' },
          { src: 'https://placehold.co/500x333/555/fff?text=A005' },
          { src: 'https://placehold.co/500x333/666/fff?text=A006' },
        ]
      }
      // Próximo evento:
      // { letter: 'B', title: 'Nombre', date: '—', description: '...', photos: [] }
    ];

    const selected = new Set();
    const nav = document.getElementById('tab-nav');
    const mainEl = document.getElementById('main-content');

    events.forEach((ev, idx) => {
      const btn = document.createElement('button');
      btn.textContent = ev.title;
      btn.dataset.idx = idx;
      if (idx === 0) btn.classList.add('active');
      btn.addEventListener('click', () => switchTab(idx));
      nav.appendChild(btn);

      const panel = document.createElement('div');
      panel.className = 'event-panel' + (idx === 0 ? ' active' : '');
      panel.id = 'panel-' + idx;
      panel.innerHTML = `
        <div class="event-meta">
          <h2>${ev.title}</h2>
          <div class="date">${ev.date}</div>
          <p>${ev.description}</p>
        </div>
        <div class="photo-grid" id="grid-${idx}"></div>
      `;
      mainEl.appendChild(panel);

      const grid = panel.querySelector('#grid-' + idx);
      ev.photos.forEach((photo, i) => {
        const code = ev.letter + String(i + 1).padStart(3, '0');
        const item = document.createElement('div');
        item.className = 'photo-item';
        item.setAttribute('data-code', code);
        item.innerHTML = `<img src="${photo.src}" alt="${code}" draggable="false" />`;
        item.addEventListener('click', () => toggleSelect(item, code));
        grid.appendChild(item);
      });
    });

    function switchTab(idx) {
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.event-panel').forEach(p => p.classList.remove('active'));
      document.querySelector(`nav button[data-idx="${idx}"]`).classList.add('active');
      document.getElementById('panel-' + idx).classList.add('active');
    }

    function toggleSelect(item, code) {
      if (selected.has(code)) { selected.delete(code); item.classList.remove('selected'); }
      else { selected.add(code); item.classList.add('selected'); }
      updateCart();
    }

    function clearCart() {
      selected.clear();
      document.querySelectorAll('.photo-item.selected').forEach(el => el.classList.remove('selected'));
      updateCart();
    }

    function updateCart() {
      const count = selected.size;
      document.getElementById('cart-count').textContent = count;
      document.getElementById('cart-codes').textContent = [...selected].sort().join(', ');
      document.getElementById('cart-bar').classList.toggle('visible', count > 0);
    }

    function openWhatsApp() {
      if (selected.size === 0) return;
      const codes = [...selected].sort().join(', ');
      const msg = encodeURIComponent(
        `Hola Luma, me interesan las siguientes fotos de Luma Audiovisuales:\n${codes}\n\n¿Podés darme más información sobre formatos y precios?`
      );
      window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`, '_blank');
    }
  </script>

</body>
</html>
